name: Update broadcast crews
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/crews.py, .github/workflows/crews.yml]
permissions:
  contents: write
concurrency: crews
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/crews.py
      - name: Save if changed
        run: |
          git add crews.json 2>/dev/null || exit 0
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update broadcast crews"
          git pull --rebase -q && git push
